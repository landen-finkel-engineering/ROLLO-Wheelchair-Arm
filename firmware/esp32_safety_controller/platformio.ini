; WRA-1 ESP32 safety supervisor + ST3215 bus bridge
; Board: any ESP32-WROOM-32 dev board (Freenove ESP32-WROOM, Espressif DevKitC).
; Build/upload:   pio run -t upload      Monitor: pio device monitor -b 921600
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
