# WRA-1 servo calibration.  PLACEHOLDER VALUES - overwritten by software/tools/servo_setup.py.
# counts = center + dir * servo_angle_deg * 4096 / 360   (servo angle = joint angle x drive ratio).
# 'center' = counts at joint zero; servo_setup.py sets the servo's homing offset so that the MIDDLE
# of each joint range sits at 2048 (no wrap through 0/4095).  The values below assume dir = +1.
# The ESP32 refuses to enable torque until its own copy of the limits is marked calibrated.
calibrated: false
side: right            # right | left (mounting side; the arm itself is identical)
servos:
  1: {name: j1, center: 2048, dir: 1}
  2: {name: j2, center: 1097, dir: 1}
  3: {name: j3, center: 2446, dir: 1}
  4: {name: q1, center: 2048, dir: 1}
  5: {name: theta1, center: 2048, dir: 1}
  6: {name: q2, center: 2048, dir: 1}
  7: {name: theta2, center: 2048, dir: 1}
  8: {name: claw, center: 3057, dir: 1}
